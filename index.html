<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mood Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>How Are You Feeling Today?</h1>
    
    <div class="mood-picker">
      <button class="mood-btn" data-mood="happy">😄</button>
      <button class="mood-btn" data-mood="neutral">😐</button>
      <button class="mood-btn" data-mood="sad">😢</button>
      <button class="mood-btn" data-mood="angry">😠</button>
      <button class="mood-btn" data-mood="tired">😴</button>
    </div>

    <textarea id="journal" placeholder="Write about your day..."></textarea>

    <button id="saveBtn">Save Entry</button>

    <h2>Past Entries</h2>
    <div id="entries"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
